[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kai-metadata-inspector"
version = "2.0.0"
description = "Offline, privacy-focused image metadata inspector and cleaner"
requires-python = ">=3.11"
dependencies = [
  "PySide6==6.11.2",
  "Pillow==12.3.0",
  "pillow-heif==1.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
